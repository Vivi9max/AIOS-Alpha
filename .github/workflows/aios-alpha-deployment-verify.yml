
name: AIOS Alpha Autonomous Development Verification

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional deployed AIOS Alpha URL"
        required: false
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Reconcile lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Export reconciled package lock
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-package-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Verify C170.1 Repository Intelligence
        run: node --test scripts/aios-engineering-context.test.mjs

      - name: Verify C170.2 Dependency Impact Analyzer
        run: node --test scripts/aios-dependency-impact.test.mjs

      - name: Verify deployment resolver and health checker unit tests
        run: node --test scripts/wait-for-vercel-deployment.test.mjs scripts/verify-deployment.test.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Resolve deployment URL
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_URL: ${{ inputs.base_url }}
        run: |
          if [ -n "$MANUAL_URL" ]; then
            echo "base_url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
          else
            node scripts/wait-for-vercel-deployment.mjs
          fi

      - name: Check automation bypass secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Missing GitHub Actions secret: VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

          echo "Vercel automation bypass secret is configured."

      - name: Verify resolved Vercel deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.base_url }}"
