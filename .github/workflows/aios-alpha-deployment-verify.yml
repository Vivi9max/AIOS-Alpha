name: AIOS Alpha Deployment Verify

on:
  push:
    branches:
      - c133-automated-deployment-verification

  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional deployed AIOS Alpha URL"
        required: false
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve deployment URL
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_URL: ${{ inputs.base_url }}
        run: |
          if [ -n "$MANUAL_URL" ]; then
            echo "base_url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
          else
            node scripts/wait-for-vercel-deployment.mjs
          fi

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Verify deployed AIOS Alpha
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.base_url }}"
