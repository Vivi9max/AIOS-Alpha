name: AIOS Alpha Production Commit Verification

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: aios-production-verification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and Verify Exact Production Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Enforce main-only Production verification
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production verification is restricted to main."
            echo "::error::Current ref: $GITHUB_REF"
            exit 1
          fi

          echo "Production verification target confirmed: main."

      - name: Checkout exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if [ "$actual_sha" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Checkout SHA does not match triggering commit."
            exit 1
          fi

          echo "Exact triggering commit verified."
          echo "Commit SHA: $actual_sha"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Reconcile lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Export reconciled package lock
        uses: actions/upload-artifact@v4
        with:
          name: reconciled-package-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Verify C170.1 Repository Intelligence
        run: node --test scripts/aios-engineering-context.test.mjs

      - name: Verify C170.2 Dependency Impact Analyzer
        run: node --test scripts/aios-dependency-impact.test.mjs

      - name: Verify C170.3 Engineering Secret Guard
        run: node --test scripts/aios-engineering-secret-guard.test.mjs

      - name: Verify C170.3 Provider Security Boundary
        run: node --test scripts/aios-engineering-provider-security.test.mjs

      - name: Verify C170.3 Engineering Provider Adapter
        run: node --test scripts/aios-engineering-provider-adapter.test.mjs

      - name: Verify C170.4 Independent Verification Runtime
        run: node --test scripts/aios-engineering-verification-runtime.test.mjs

      - name: Verify C170.7 deployment and canonical domain verification
        run: |
          set -euo pipefail

          node --test \
            scripts/wait-for-vercel-deployment.test.mjs \
            scripts/verify-deployment.test.mjs \
            scripts/verify-canonical-production-domain.test.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Validate Production verification configuration
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Missing GitHub Actions secret: VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

          echo "Vercel automation bypass secret is configured."

      - name: Resolve exact Production deployment for triggering commit
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          : "${GITHUB_OUTPUT:?GitHub Actions did not provide GITHUB_OUTPUT}"

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Production verification is restricted to main."
            exit 1
          fi

          node scripts/wait-for-vercel-deployment.mjs

          if [ ! -s "$GITHUB_OUTPUT" ]; then
            echo "::error::Deployment resolver did not produce GitHub outputs."
            exit 1
          fi

          if ! grep -q '^base_url=https://' "$GITHUB_OUTPUT"; then
            echo "::error::Deployment resolver did not produce a valid HTTPS base URL."
            exit 1
          fi

          echo "Production deployment URL resolved for exact triggering commit."

      - name: Verify exact Production Commit SHA and health
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          AIOS_PRODUCTION_VERIFICATION_OUTPUT: ${{ runner.temp }}/aios-production-verification.json
        run: |
          set -euo pipefail

          : "${GITHUB_STEP_SUMMARY:?GitHub Actions did not provide GITHUB_STEP_SUMMARY}"

          node scripts/verify-deployment.mjs \
            "${{ steps.deployment.outputs.base_url }}"

          if [ ! -s "$AIOS_PRODUCTION_VERIFICATION_OUTPUT" ]; then
            echo "::error::Production verification receipt was not created."
            exit 1
          fi

          echo "Exact Production Commit SHA verification completed."

      - name: Verify canonical Production domain
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          AIOS_CANONICAL_DOMAIN_VERIFICATION_OUTPUT: ${{ runner.temp }}/aios-canonical-domain-verification.json
        run: |
          set -euo pipefail

          node scripts/verify-canonical-production-domain.mjs

          if [ ! -s "$AIOS_CANONICAL_DOMAIN_VERIFICATION_OUTPUT" ]; then
            echo "::error::Canonical domain verification receipt was not created."
            exit 1
          fi

          echo "Canonical Production domain verification completed."

      - name: Validate both Production verification receipts
        if: success()
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PRIMARY_RECEIPT: ${{ runner.temp }}/aios-production-verification.json
          CANONICAL_RECEIPT: ${{ runner.temp }}/aios-canonical-domain-verification.json
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const expectedSha = process.env.EXPECTED_COMMIT_SHA;

          const receipts = [
            {
              path: process.env.PRIMARY_RECEIPT,
              expectedUrlPattern: /^https:\/\/.+$/,
              label: "Deployment URL"
            },
            {
              path: process.env.CANONICAL_RECEIPT,
              expectedUrlPattern: /^https:\/\/aiosalpha\.com$/,
              label: "Canonical domain"
            }
          ];

          for (const item of receipts) {
            const receipt = JSON.parse(
              fs.readFileSync(item.path, "utf8")
            );

            if (receipt.schemaVersion !== 1) {
              throw new Error(
                `${item.label}: unsupported receipt schema.`
              );
            }

            if (receipt.status !== "PRODUCTION_VERIFIED") {
              throw new Error(
                `${item.label}: receipt is not PRODUCTION_VERIFIED.`
              );
            }

            if (
              receipt.expectedCommitSha !== expectedSha ||
              receipt.observedCommitSha !== expectedSha
            ) {
              throw new Error(
                `${item.label}: Commit SHA mismatch.`
              );
            }

            if (receipt.repository !== "Vivi9max/AIOS-Alpha") {
              throw new Error(
                `${item.label}: repository identity mismatch.`
              );
            }

            if (
              typeof receipt.deploymentUrl !== "string" ||
              !item.expectedUrlPattern.test(receipt.deploymentUrl)
            ) {
              throw new Error(
                `${item.label}: deployment URL mismatch.`
              );
            }

            if (!receipt.verifiedAt || !receipt.requestId) {
              throw new Error(
                `${item.label}: verification evidence is incomplete.`
              );
            }

            console.log(
              `${item.label} receipt validated: ${receipt.deploymentUrl}`
            );
          }

          console.log(
            `Both Production receipts match ${expectedSha}.`
          );
          NODE

      - name: Preserve Production verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-production-verification-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aios-production-verification.json
            ${{ runner.temp }}/aios-canonical-domain-verification.json
          if-no-files-found: warn
          retention-days: 90
