name: AIOS Alpha CI

on:
  push:
    branches:
      - main
      - "c*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify project continuity
        run: npm run verify

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
