name: AIOS Alpha CI

on:
  push:
    branches:
      - main
      - "c*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify C170.1 Repository Intelligence
        run: node --test scripts/aios-engineering-context.test.mjs

      - name: Verify C170.2 Dependency Impact Analyzer
        run: node --test scripts/aios-dependency-impact.test.mjs

      - name: Verify C170.3 Engineering Secret Guard
        run: node --test scripts/aios-engineering-secret-guard.test.mjs

      - name: Verify C170.3 Provider Security Boundary
        run: node --test scripts/aios-engineering-provider-security.test.mjs

      - name: Verify C170.3 Engineering Provider Adapter
        run: node --test scripts/aios-engineering-provider-adapter.test.mjs

      - name: Verify C170.4 Independent Verification Runtime
        run: node --test scripts/aios-engineering-verification-runtime.test.mjs

      - name: Verify C170.5 Verified Delivery Builder
        run: node --test scripts/aios-verified-delivery-builder.test.mjs

      - name: Verify C170.5.4 Independent Artifact Verifier
        run: node --test scripts/aios-verified-delivery-artifact-verifier.test.mjs

      - name: C169.8-D2.1 independent control-plane verification
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p test-results
          report_file="test-results/c169.8-d2.1-verification.txt"

          set +e
          node scripts/verify-autonomous-development-control-plane.mjs 2>&1 | tee "$report_file"
          test_exit_code=${PIPESTATUS[0]}
          set -e

          {
            echo "## C169.8-D2.1 independent control-plane verification"
            echo
            echo "- Commit SHA: \`$COMMIT_SHA\`"
            echo "- Workflow Run: \`$WORKFLOW_RUN_ID\`"
            echo "- Attempt: \`$WORKFLOW_RUN_ATTEMPT\`"
            echo "- Test process exit code: \`$test_exit_code\`"
            echo
            echo '```text'
            cat "$report_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_exit_code"

      - name: Preserve C169.8-D2.1 verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c169-8-d2-1-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/c169.8-d2.1-verification.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify project continuity
        run: npm run verify

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Generate C170.4 verification receipt for candidate commit
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"

          if [ "$actual_head" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Checkout HEAD does not match the workflow candidate SHA."
            exit 1
          fi

          receipt_path="$RUNNER_TEMP/aios-c1704-receipt.json"

          node scripts/aios-engineering-verification-runtime.mjs verify > "$receipt_path"

          test -s "$receipt_path"

          echo "C170.4 receipt generated for $actual_head"

      - name: Restore clean candidate checkout for Git-based analysis
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"

          if [ "$actual_head" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Checkout HEAD does not match the workflow candidate SHA."
            exit 1
          fi

          echo "Tracked files changed by CI before restoration:"
          git diff --name-status HEAD --

          echo "Restoring tracked files to the exact candidate commit."
          git reset --hard "$EXPECTED_COMMIT_SHA"

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked worktree is still dirty after restoration."
            git status --short
            exit 1
          fi

          restored_head="$(git rev-parse HEAD)"

          if [ "$restored_head" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Candidate HEAD changed during restoration."
            exit 1
          fi

          echo "Clean candidate checkout verified: $restored_head"

      - name: Generate real C170.5 delivery artifact from Git commits
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"

          if [ "$actual_head" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Candidate SHA changed before artifact generation."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked worktree is dirty before C170.5 generation."
            git status --short
            exit 1
          fi

          base_sha="$(git merge-base origin/main "$actual_head")"

          if [ -z "$base_sha" ] || [ "$base_sha" = "$actual_head" ]; then
            echo "::error::A valid main-to-candidate commit range is required."
            exit 1
          fi

          receipt_path="$RUNNER_TEMP/aios-c1704-receipt.json"
          artifact_path="$RUNNER_TEMP/aios-verified-delivery.json"
          summary_path="$RUNNER_TEMP/aios-delivery-builder-summary.json"

          node scripts/aios-verified-delivery-builder.mjs \
            --base "$base_sha" \
            --receipt "$receipt_path" \
            --output "$artifact_path" \
            > "$summary_path"

          test -s "$artifact_path"
          test -s "$summary_path"

          echo "C170.5 delivery artifact generated."
          echo "Base Commit: $base_sha"
          echo "Candidate Commit: $actual_head"

      - name: Independently verify generated delivery artifact
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"
          base_sha="$(git merge-base origin/main "$actual_head")"

          if [ "$actual_head" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Candidate SHA changed before independent verification."
            exit 1
          fi

          artifact_path="$RUNNER_TEMP/aios-verified-delivery.json"
          verification_path="$RUNNER_TEMP/aios-delivery-verification.json"

          node scripts/aios-verified-delivery-artifact-verifier.mjs \
            --artifact "$artifact_path" \
            --base "$base_sha" \
            --head "$actual_head" \
            > "$verification_path"

          test -s "$verification_path"

          cat "$verification_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Create delivery artifact SHA-256 manifest
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          sha256sum \
            aios-verified-delivery.json \
            aios-delivery-builder-summary.json \
            aios-delivery-verification.json \
            > aios-delivery-artifact.sha256

          cat aios-delivery-artifact.sha256

      - name: Preserve independently verified delivery artifact
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aios-verified-delivery-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aios-verified-delivery.json
            ${{ runner.temp }}/aios-delivery-builder-summary.json
            ${{ runner.temp }}/aios-delivery-verification.json
            ${{ runner.temp }}/aios-delivery-artifact.sha256
          if-no-files-found: error
          retention-days: 7
