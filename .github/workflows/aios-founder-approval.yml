name: AIOS Alpha Founder Approval Record

on:
  workflow_dispatch:
    inputs:
      decision:
        description: "Founder decision"
        required: true
        type: choice
        default: REJECT
        options:
          - APPROVE
          - REJECT
      approval_scope:
        description: "One approval scope only"
        required: true
        type: choice
        default: merge
        options:
          - merge
          - production_deployment

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: aios-founder-approval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  founder-approval:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout protected main control plane
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Founder identity and one-time dispatch
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_FOUNDER: Vivi9max
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Only workflow_dispatch is accepted."
            exit 1
          fi

          if [ "$ACTOR" != "$EXPECTED_FOUNDER" ]; then
            echo "::error::Only the repository Founder may create approval records."
            exit 1
          fi

          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::Approval workflow reruns are not accepted."
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Founder Approval must execute from protected main."
            exit 1
          fi

          echo "Founder identity and protected control-plane checks passed."

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Automatically resolve exact Founder approval candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          node scripts/aios-founder-approval-resolver.mjs \
            | tee "$RUNNER_TEMP/aios-founder-approval-candidate.json"

          test -s "$RUNNER_TEMP/aios-founder-approval-candidate.json"

          echo "Resolved candidate:"
          cat "$RUNNER_TEMP/aios-founder-approval-candidate.json"

      - name: Validate exact candidate branch, commit and latest main ancestry
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          if [ "$CANDIDATE_BRANCH" = "main" ] || ! git check-ref-format --branch "$CANDIDATE_BRANCH"; then
            echo "::error::A valid non-main candidate branch is required."
            exit 1
          fi

          if ! [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Candidate SHA must be a full 40-character Git SHA."
            exit 1
          fi

          requested_sha="$(printf '%s' "$CANDIDATE_SHA" | tr 'A-F' 'a-f')"

          git fetch --no-tags origin \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/aios-approval-candidate" \
            "+refs/heads/main:refs/remotes/origin/aios-approval-main"

          actual_sha="$(git rev-parse refs/remotes/origin/aios-approval-candidate)"
          latest_main_sha="$(git rev-parse refs/remotes/origin/aios-approval-main)"

          if [ "$actual_sha" != "$requested_sha" ]; then
            echo "::error::Candidate branch HEAD changed. Generate a new delivery artifact and review."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            refs/remotes/origin/aios-approval-main \
            refs/remotes/origin/aios-approval-candidate; then
            echo "::error::Candidate does not contain the latest main commit. Update the candidate branch and rerun CI."
            exit 1
          fi

          echo "Candidate branch and HEAD are bound to $requested_sha"
          echo "Latest main commit $latest_main_sha is an ancestor of the candidate."

      - name: Validate Source Run ID
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Source Run ID must contain digits only."
            exit 1
          fi

      - name: Fetch immutable Source Run identity and artifact inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "$RUNNER_TEMP/aios-source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/aios-source-artifacts.json"
          test -s "$RUNNER_TEMP/aios-source-run.json"
          test -s "$RUNNER_TEMP/aios-source-artifacts.json"

      - name: Download and verify raw Source Artifact ZIP digest
        id: source_archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.source_run_id }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          expected_name="aios-verified-delivery-${CANDIDATE_SHA}-${SOURCE_RUN_ID}"

          mapfile -t artifact_rows < <(
            jq -cer \
              --arg name "$expected_name" \
              --arg run_id "$SOURCE_RUN_ID" \
              --arg branch "$CANDIDATE_BRANCH" \
              --arg sha "$(printf '%s' "$CANDIDATE_SHA" | tr 'A-F' 'a-f')" \
              '
                [
                  .artifacts[]
                  | select(
                      .name == $name
                      and .expired == false
                      and ((.workflow_run.id | tostring) == $run_id)
                      and (.workflow_run.head_branch == $branch)
                      and ((.workflow_run.head_sha | ascii_downcase) == $sha)
                    )
                  | [.id, .digest]
                  | @tsv
                ][]
              ' "$RUNNER_TEMP/aios-source-artifacts.json"
          )

          if [ "${#artifact_rows[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one unexpired candidate-bound Source Artifact; found ${#artifact_rows[@]}."
            exit 1
          fi

          IFS=$'\t' read -r artifact_id artifact_digest <<< "${artifact_rows[0]}"

          if ! [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Artifact ID is invalid."
            exit 1
          fi

          if ! [[ "$artifact_digest" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "::error::GitHub Artifact SHA-256 digest is missing or invalid."
            exit 1
          fi

          archive_path="$RUNNER_TEMP/aios-source-artifact.zip"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$archive_path"

          if [ ! -s "$archive_path" ]; then
            echo "::error::Downloaded Source Artifact ZIP is empty."
            exit 1
          fi

          expected_sha256="${artifact_digest#sha256:}"
          actual_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"

          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::Source Artifact ZIP SHA-256 mismatch."
            echo "::error::Expected: $expected_sha256"
            echo "::error::Actual:   $actual_sha256"
            exit 1
          fi

          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

          echo "Raw Source Artifact ZIP SHA-256 verified."
          echo "Artifact ID: $artifact_id"

      - name: Download exact verified-delivery artifact from Source Run
        uses: actions/download-artifact@v4
        with:
          name: aios-verified-delivery-${{ steps.candidate.outputs.candidate_sha }}-${{ steps.candidate.outputs.source_run_id }}
          run-id: ${{ steps.candidate.outputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/source-artifact

      - name: Resolve all required evidence files
        id: evidence
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/source-artifact
        run: |
          set -euo pipefail

          resolve_one() {
            local filename="$1"
            local output_name="$2"
            mapfile -t matches < <(find "$SOURCE_DIR" -type f -name "$filename" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $filename; found ${#matches[@]}."
              exit 1
            fi
            echo "$output_name=${matches[0]}" >> "$GITHUB_OUTPUT"
          }

          resolve_one "aios-founder-review.json" "review"
          resolve_one "aios-verified-delivery.json" "artifact"
          resolve_one "aios-delivery-builder-summary.json" "builder_summary"
          resolve_one "aios-delivery-verification.json" "verification"
          resolve_one "aios-delivery-artifact.sha256" "manifest"

      - name: Verify C170.6.9 Source Run identity and archive integrity
        env:
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.source_run_id }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          REVIEW_REPORT: ${{ steps.evidence.outputs.review }}
          ARTIFACT_ARCHIVE: ${{ steps.source_archive.outputs.archive_path }}
        run: |
          set -euo pipefail
          node scripts/aios-founder-approval-source-run.mjs \
            --run "$RUNNER_TEMP/aios-source-run.json" \
            --artifacts "$RUNNER_TEMP/aios-source-artifacts.json" \
            --review "$REVIEW_REPORT" \
            --artifact-archive "$ARTIFACT_ARCHIVE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --candidate-branch "$CANDIDATE_BRANCH" \
            --candidate-sha "$CANDIDATE_SHA"

      - name: Verify C170.6.3 Founder Approval Record tests
        run: node --test scripts/aios-founder-approval-record.test.mjs

      - name: Verify C170.6.9 Source Run Identity and Artifact Integrity tests
        run: node --test scripts/aios-founder-approval-source-run.test.mjs

      - name: Verify C170.6.11 Founder Approval Resolver tests
        run: node --test scripts/aios-founder-approval-resolver.test.mjs

      - name: Create write-once Founder approval record
        shell: bash
        env:
          EXPECTED_FOUNDER: Vivi9max
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ steps.candidate.outputs.source_run_id }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          DECISION: ${{ inputs.decision }}
          APPROVAL_SCOPE: ${{ inputs.approval_scope }}
          REVIEW_REPORT: ${{ steps.evidence.outputs.review }}
          DELIVERY_ARTIFACT: ${{ steps.evidence.outputs.artifact }}
          BUILDER_SUMMARY: ${{ steps.evidence.outputs.builder_summary }}
          VERIFICATION: ${{ steps.evidence.outputs.verification }}
          MANIFEST: ${{ steps.evidence.outputs.manifest }}
          OUTPUT_PATH: ${{ runner.temp }}/aios-founder-approval/record.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"

          node scripts/aios-founder-approval-record.mjs \
            --expected-founder "$EXPECTED_FOUNDER" \
            --actor "$ACTOR" \
            --event-name "$EVENT_NAME" \
            --run-attempt "$RUN_ATTEMPT" \
            --source-run-id "$SOURCE_RUN_ID" \
            --candidate-branch "$CANDIDATE_BRANCH" \
            --candidate-sha "$CANDIDATE_SHA" \
            --decision "$DECISION" \
            --approval-scope "$APPROVAL_SCOPE" \
            --review-report "$REVIEW_REPORT" \
            --delivery-artifact "$DELIVERY_ARTIFACT" \
            --builder-summary "$BUILDER_SUMMARY" \
            --verification "$VERIFICATION" \
            --manifest "$MANIFEST" \
            --output "$OUTPUT_PATH" \
            | tee "$RUNNER_TEMP/aios-founder-approval/summary.json"

          test -s "$OUTPUT_PATH"

      - name: Preserve Founder approval evidence
        id: approval_evidence
        uses: actions/upload-artifact@v4
        with:
          name: aios-founder-approval-${{ steps.candidate.outputs.candidate_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aios-founder-approval/record.json
            ${{ runner.temp }}/aios-founder-approval/summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish exact-commit Founder approval status
        if: steps.approval_evidence.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          RECORD_PATH: ${{ runner.temp }}/aios-founder-approval/record.json
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status_state="failure"
          status_description="Founder approval does not authorize merge."

          if node - "$RECORD_PATH" "$CANDIDATE_SHA" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const candidateSha = process.argv[3].toLowerCase();
          const valid =
            record.recordType === "AIOS_FOUNDER_APPROVAL_RECORD" &&
            record.decision === "APPROVE" &&
            record.approvalScope === "merge" &&
            record.approved === true &&
            record.mergeAuthorized === true &&
            record.productionDeploymentAuthorized === false &&
            record.candidate?.commitSha === candidateSha &&
            record.repository === "Vivi9max/AIOS-Alpha" &&
            record.executionPerformed === false &&
            record.mergeExecuted === false &&
            record.productionMutationPerformed === false;
          process.exit(valid ? 0 : 1);
          NODE
          then
            status_state="success"
            status_description="Founder approved this exact candidate commit for merge."
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$status_state" \
            -f context="founder-approval" \
            -f description="$status_description" \
            -f target_url="$TARGET_URL"

          echo "Published founder-approval=$status_state for $CANDIDATE_SHA"
